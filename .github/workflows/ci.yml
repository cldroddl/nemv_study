name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Lint (scoped to src — no tests/ dir exists in this repo)
        run: node_modules/.bin/vue-cli-service lint src --no-fix

  backend-syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Syntax-check all backend JS files
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
