name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Lint (scoped to src — no tests/ dir exists in this repo)
        run: node_modules/.bin/vue-cli-service lint src --no-fix

  backend-syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Syntax-check all backend JS files
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      # mongodb-memory-server downloads a real mongod binary into node_modules/.cache
      # on first use, which yarn's own cache (above) does not cover since node_modules
      # is rebuilt fresh every run. Cache it separately so only the first CI run per
      # mongodb-memory-server version pays the download cost.
      - uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('backend/yarn.lock') }}
      - run: yarn test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:unit
